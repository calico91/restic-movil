name: restic_movil
description: "Aplicación móvil para la gestión y operación de Restaurantes y heladerías."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+3

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  logger: ^2.6.2
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  google_fonts: ^7.0.2
  cached_network_image: ^3.4.1
  reactive_forms: ^18.2.2
  lottie: ^3.3.2
  http: ^1.6.0
  stomp_dart_client: ^3.0.1
  blue_thermal_printer: ^1.2.3
  flutter_localizations:
    sdk: flutter
  animated_splash_screen: ^1.3.0
  page_transition: ^2.2.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  assets:
   - .env
   - assets/
   - assets/icons/

  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icono_app.png"
  min_sdk_android: 21
  remove_alpha_ios: true
